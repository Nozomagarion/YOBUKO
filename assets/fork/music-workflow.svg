<title id="title">YOBUKO — Studio + Multijoueur + DJ</title>
<desc id="desc">Ta musique, de A à Z. Composer, enregistrer, créer ensemble, mixer et jouer dans une seule application. Projet en développement sur les fondations de Suhina et rbxport.</desc>
