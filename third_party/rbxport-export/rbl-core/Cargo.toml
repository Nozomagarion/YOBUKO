[package]
name = "rbl-core"
version = "1.9.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"
description = "Shared ids, time formats and error primitives for rbxport."

[lints.rust]
unsafe_code = "deny"

[dependencies]
dirs = "5"
# `clock` only: the local offset for the dates rekordbox writes in local
# time. Already in the lock through other dependencies, so nothing new is built.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Unique sibling files for durable publication.
tempfile = "3"
serde_json = "1"
fs2 = "0.4"
same-file = "1"
# Name forms: macOS FAT/exFAT drivers list NFD names but rename and delete
# only under the form a name was stored in.
unicode-normalization = "0.1"

# Plain fsync where F_FULLFSYNC is not implemented (exFAT on macOS); see
# `durable::flush`. Already in the lock through tempfile.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", features = ["fs"] }
