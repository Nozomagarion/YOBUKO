name: Theme adapter diagnostics

# Temporary validation while the native CSS dependency graph and adapter are developed.
# The regular CI remains the merge gate; this job grants no write permission.
on:
  pull_request:
    paths:
      - 'crates/ui/**'
      - 'apps/suhina/src/theme_files.rs'
      - '.github/workflows/theme-adapter-check.yml'
  push:
    branches: [feature/theme-skins-layout]

permissions:
  contents: read

concurrency:
  group: theme-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo check -p suhina-ui --all-targets
      - name: Resolved lockfile for review
        if: always()
        run: |
          python3 - <<'PY'
          import base64, pathlib, zlib
          print('THEME_LOCK_BEGIN')
          print(base64.b64encode(zlib.compress(pathlib.Path('Cargo.lock').read_bytes())).decode())
          print('THEME_LOCK_END')
          PY
      - name: Public sources for offline native verification
        if: always()
        run: |
          mkdir -p target/theme-verification
          git bundle create target/theme-verification/source.bundle HEAD
          cp Cargo.lock target/theme-verification/Cargo.lock
          cp docs/research/parity-live-12-by-area.png target/theme-verification/parent-parity.png
          python3 - <<'PY'
          import hashlib, pathlib, tarfile, tomllib
          root = pathlib.Path.home() / '.cargo'
          destination = pathlib.Path('target/theme-verification')
          # Only lockfile-selected public crates.io archives and sparse index metadata;
          # never Cargo config, credentials, build outputs or runner environment files.
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          selected = {f"{p['name']}-{p['version']}": p['checksum'] for p in packages if p.get('source', '').startswith('registry+')}
          archives = [tarfile.open(destination / f'registry-{n}.tar.xz', 'w:xz', preset=1) for n in range(8)]
          try:
              for archive in sorted((root / 'registry/cache').glob('index.crates.io-*/*.crate')):
                  package = archive.name.removesuffix('.crate')
                  if package not in selected:
                      continue
                  if hashlib.sha256(archive.read_bytes()).hexdigest() != selected[package]:
                      raise ValueError(f'Unexpected crate checksum: {package}')
                  group = hashlib.sha256(package.encode()).digest()[0] % 8
                  archives[group].add(archive, arcname=str(archive.relative_to(root)))
              for index in sorted((root / 'registry/index').glob('index.crates.io-*')):
                  for name in ['config.json', '.cache']:
                      source = index / name
                      if source.exists():
                          archives[0].add(source, arcname=str(source.relative_to(root)))
          finally:
              for archive in archives:
                  archive.close()
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-source-and-lock
          path: |
            target/theme-verification/source.bundle
            target/theme-verification/Cargo.lock
            target/theme-verification/parent-parity.png
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-0
          path: target/theme-verification/registry-0.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-1
          path: target/theme-verification/registry-1.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-2
          path: target/theme-verification/registry-2.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-3
          path: target/theme-verification/registry-3.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-4
          path: target/theme-verification/registry-4.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-5
          path: target/theme-verification/registry-5.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-6
          path: target/theme-verification/registry-6.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-public-registry-7
          path: target/theme-verification/registry-7.tar.xz
          retention-days: 1
      - run: cargo test -p suhina-ui --lib kit::native_css
      - run: cargo test -p suhina theme_files
