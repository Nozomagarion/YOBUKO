name: Multiplayer DJ distribution candidate

# An explicit version tag builds a candidate; no schedule publishes unreviewed source merges.
on:
  push:
    tags: ['multiplayer-v*']
  # Explicitly dispatch an immutable version tag after a CI-only correction marked [skip ci].
  # Dispatching a branch is rejected by the same version/SHA gate below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo 'Dispatch an immutable multiplayer version tag, not a branch' >&2
            exit 1
          fi
          version="${TAG#multiplayer-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{14}\+[0-9a-f]{7}$ ]]; then
            echo 'Use multiplayer-vMAJOR.MINOR.PATCH-nightly.YYYYMMDDHHMMSS+COMMIT7' >&2
            exit 1
          fi
          if [ "${version##*+}" != "${GITHUB_SHA:0:7}" ]; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      # The Rekordbox USB export (rbxport's exportLibrary.db) builds SQLCipher with a vendored
      # OpenSSL, whose Configure needs a full Perl; Git Bash's own perl lacks modules it uses.
      - name: Windows Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      # rbxport (DJ mode) is a Tauri app: its interface is built with Node.js and pnpm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb imagemagick libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf
      - name: Source and regression gates
        run: |
          python3 scripts/fork_sources.py check
          python3 scripts/fork_readme.py --check
          python3 -m unittest discover -s scripts -p 'test_fork*.py'
          python3 scripts/docs.py check
          python3 scripts/settings_guide.py --check
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --locked --workspace --no-fail-fast
          else
            cargo test --locked --workspace --no-fail-fast
          fi
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - name: Set the common distribution version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('Cargo.toml')
          p.write_text(re.sub(r'^version = "[^"]+"', 'version = "' + os.environ['VERSION'] + '"', p.read_text(), count=1, flags=re.M))
          PY
          cargo check -p suhina-update
      - name: Build the three programs
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p suhina -p suhina-cli -p suhina-plugin-host --target "$target"
            done
          else
            cargo build --release --locked -p suhina -p suhina-cli -p suhina-plugin-host
          fi
      - name: Package the complete distribution
        run: |
          package="dist/suhina-multiplayer-$PLATFORM"
          mkdir -p "$package"
          for bin in suhina suhina-cli suhina-plugin-host; do
            case "$RUNNER_OS" in
              macOS) lipo -create "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin" -output "$package/$bin" ;;
              Windows) cp "target/release/$bin.exe" "$package/" ;;
              *) cp "target/release/$bin" "$package/" ;;
            esac
          done
          cp LICENSE NOTICE ATTRIBUTION.md "$package/"
          cp devices/fm-synth/LICENSE-APACHE crates/stretch/LICENSE-signalsmith.txt "$package/"
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/macos_app.sh "$package" "$VERSION"
            # DJ mode: rbxport, built from third_party/rbxport-app, inside YOBUKO.app.
            bash scripts/rbxport_build.sh "$package"
            # DJ mode: Mixxx, the official release, inside YOBUKO.app (Apple Silicon).
            bash scripts/mixxx_fetch.sh "$package"
            python3 scripts/fork_package.py "$package/Suhina.app/Contents/MacOS" "$VERSION"
            codesign --force --deep --sign - "$package/Suhina.app"
          else
            # DJ mode: rbxport, built from third_party/rbxport-app, beside YOBUKO.
            bash scripts/rbxport_build.sh "$package"
            # DJ mode: Mixxx, the official release, beside YOBUKO (Windows; Linux uses the system's).
            bash scripts/mixxx_fetch.sh "$package"
            python3 scripts/fork_package.py "$package" "$VERSION"
          fi
          cli="$package/suhina-cli"
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          "$cli" --version
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a "suhina-multiplayer-$PLATFORM.zip" "suhina-multiplayer-$PLATFORM")
          else
            tar -czf "dist/suhina-multiplayer-$PLATFORM.tar.gz" -C dist "suhina-multiplayer-$PLATFORM"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # The files a Linux user installs from: one AppImage and one .deb.
            bash scripts/linux_package.sh "dist/suhina-multiplayer-$PLATFORM" "$VERSION" dist
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            # The file a Mac user installs from: a disk image to drag YOBUKO into Applications.
            bash scripts/macos_dmg.sh "$package" dist/YOBUKO-Mac.dmg
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # The file a Windows user installs from: a setup program with Start menu entry.
            bash scripts/windows_installer.sh "$package" "$VERSION" dist YOBUKO-Windows-Setup
          fi
          # Corresponding source at the exact tagged commit, including pinned rbxport code.
          git archive --format=tar.gz --prefix=suhina-source/ HEAD > "dist/source-$PLATFORM.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: multiplayer-distribution-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          retention-days: 14
          if-no-files-found: error

  # The ready-to-install files go on this tag's own GitHub release, so friends download them
  # from the Releases page: the Mac disk image, the Windows setup program, the Linux AppImage and
  # .deb. Only this job has a write token, and only after every platform passed its gates. The
  # in-app updater reads the separate `multiplayer` release, which this does not touch.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/yobuko-release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: multiplayer-distribution-*
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        run: |
          set -euo pipefail
          ls -l dist
          files=(dist/YOBUKO-Mac.dmg dist/YOBUKO-Windows-Setup.exe dist/*.AppImage dist/*.deb)
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then echo "missing installer: $file" >&2; exit 1; fi
          done
          notes=$(mktemp)
          sed "s/@VERSION@/$VERSION/g" .github/yobuko-release-notes.md > "$notes"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "YOBUKO $VERSION" --notes-file "$notes"
          else
            gh release edit "$TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
