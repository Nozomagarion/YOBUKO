name: Multiplayer fork checks and development builds

on:
  workflow_dispatch:
  push:
    branches: [feature/multiplayer, feature/online, 'feature/online-*', 'integration/multiplayer-*']
  pull_request:
    branches: [feature/multiplayer, feature/online]

permissions:
  contents: read

concurrency:
  group: multiplayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  # Reuse the test profile's smaller artifacts for these development builds.
  CARGO_PROFILE_DEV_DEBUG: 'false'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04, the oldest supported, so the Linux packages run on distributions as old as it.
          - os: yobuko-linux  # Ubuntu 22.04 in WSL on the owner's own PC (self-hosted runner): no GitHub minutes
            package: linux
          - os: yobuko-windows  # the owner's own PC (self-hosted runner): no GitHub minutes
            package: windows-x86_64
          - os: yobuko-mac  # the owner's own Mac (self-hosted runner): no GitHub macOS minutes
            package: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        # The Mac's own Python is used on the self-hosted runner: the downloaded
        # macOS build installs only into /Users/runner, which exists on GitHub's machines alone.
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Keep jobs apart from the owner's own files
        # The owner's Mac and PC hold real YOBUKO settings and plug-ins. Tests must not read or change
        # them, so later steps get an empty home; Rust stays where it is installed. The Mac also has
        # only python3 while the scripts call python.
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          rm -rf "$RUNNER_TEMP/home" && mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/bin/python"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      # The Rekordbox USB export (rbxport's exportLibrary.db) builds SQLCipher with a vendored
      # OpenSSL, whose Configure needs a full Perl; Git Bash's own perl lacks modules it uses.
      - name: Windows Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      # rbxport (DJ mode) is a Tauri app: its interface is built with Node.js and pnpm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        # The owner's Linux runner has these installed by scripts/self-hosted/yobuko-linux-runner.sh,
        # so apt only runs (with sudo) when one is missing.
        run: |
          missing=$(for p in libasound2-dev pkg-config xvfb imagemagick libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev libayatana-appindicator3-dev patchelf; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Toolchain and source identity
        run: |
          rustc -vV
          git rev-parse HEAD
      - name: Formatting
        run: cargo fmt --all --check
      - name: Collaboration tests
        run: cargo test --locked -p suhina-collaboration -p suhina-multiplayer -p suhina-dj -p suhina-update
      - name: Two independent local players
        run: cargo run --locked --profile test -p suhina-collaboration --example two_peers
      - name: Documentation and source rules
        if: runner.os == 'Linux'
        run: |
          python3 scripts/fork_sources.py check
          python3 scripts/fork_readme.py --check
          python3 -m unittest discover -s scripts -p 'test_fork*.py'
          python3 scripts/settings_guide.py --check
          python3 scripts/docs.py check
          python3 scripts/license_header.py --check
          python3 scripts/rename_suhina.py --check
          python3 scripts/inline_tests.py --check
      - name: Collaboration clippy
        run: cargo clippy --locked -p suhina-collaboration --all-targets --no-deps -- -D warnings
      # Development packages are built before the complete upstream suite so a baseline failure
      # does not hide whether this exact source compiles. The final suite still fails the job.
      - name: Build development binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          if [ "$RUNNER_OS" = 'macOS' ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --locked -p suhina -p suhina-cli -p suhina-plugin-host --target "$target"
            done
          else
            cargo build --locked -p suhina -p suhina-cli -p suhina-plugin-host
          fi
      - name: Collect and smoke-test development package
        env:
          PLATFORM: ${{ matrix.package }}
        run: |
          package="dist/suhina-multiplayer-experiment-$PLATFORM"
          mkdir -p "$package"
          for bin in suhina suhina-cli suhina-plugin-host; do
            case "$RUNNER_OS" in
              Windows) cp "target/debug/$bin.exe" "$package/" ;;
              macOS) lipo -create "target/aarch64-apple-darwin/debug/$bin" "target/x86_64-apple-darwin/debug/$bin" -output "$package/$bin" ;;
              *) cp "target/debug/$bin" "$package/" ;;
            esac
          done
          cp LICENSE NOTICE ATTRIBUTION.md README.md "$package/"
          cp devices/fm-synth/LICENSE-APACHE crates/stretch/LICENSE-signalsmith.txt "$package/"
          version=$("$package/suhina-cli${{ runner.os == 'Windows' && '.exe' || '' }}" --version | awk '{print $2}')
          python3 scripts/fork_package.py "$package" "$version"
          cp docs/multiplayer-fork.md "$package/MULTIPLAYER-STATUS.md"
          git rev-parse HEAD > "$package/SOURCE-COMMIT.txt"
          rustc -vV > "$package/BUILD-HOST.txt"
          cli="$package/suhina-cli"
          if [ "$RUNNER_OS" = 'Windows' ]; then cli="$cli.exe"; fi
          "$cli" --version
          python3 - "$package" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                   for p in sorted(root.iterdir()) if p.is_file()]
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Linux AppImage and .deb
        if: runner.os == 'Linux'
        run: |
          package="dist/suhina-multiplayer-experiment-$PLATFORM"
          version=$("$package/suhina-cli" --version | awk '{print $2}')
          # DJ mode: rbxport, built from third_party/rbxport-app, beside YOBUKO.
          bash scripts/rbxport_build.sh "$package"
          bash scripts/linux_package.sh "$package" "$version" linux-installers
          ls -l linux-installers
        env:
          PLATFORM: ${{ matrix.package }}
      # The same installers the release attaches, made from these development binaries so a
      # pull request shows they still build: the Mac disk image and the Windows setup program.
      - name: Mac disk image and Windows installer
        if: runner.os != 'Linux'
        env:
          PLATFORM: ${{ matrix.package }}
        run: |
          package="dist/suhina-multiplayer-experiment-$PLATFORM"
          staging="installer-staging/yobuko-$PLATFORM"
          mkdir -p "$staging" installers
          cp -R "$package/." "$staging/"
          if [ "$RUNNER_OS" = macOS ]; then
            version=$("$staging/suhina-cli" --version | awk '{print $2}')
            bash scripts/macos_app.sh "$staging" "$version"
            # DJ mode: rbxport, built from third_party/rbxport-app, inside YOBUKO.app.
            bash scripts/rbxport_build.sh "$staging"
            # DJ mode: Mixxx, the official release, inside YOBUKO.app (Apple Silicon).
            bash scripts/mixxx_fetch.sh "$staging"
            codesign --force --deep --sign - "$staging/Suhina.app"
            bash scripts/macos_dmg.sh "$staging" installers/YOBUKO-Mac.dmg
          else
            version=$("$staging/suhina-cli.exe" --version | awk '{print $2}')
            bash scripts/rbxport_build.sh "$staging"
            bash scripts/mixxx_fetch.sh "$staging"
            bash scripts/windows_installer.sh "$staging" "$version" installers YOBUKO-Windows-Setup
          fi
          ls -l installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os != 'Linux'
        with:
          name: yobuko-${{ matrix.package }}-installer-${{ github.sha }}
          path: installers/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: yobuko-linux-installers-${{ github.sha }}
          path: linux-installers/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: multiplayer-experiment-${{ matrix.package }}-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Workspace clippy (baseline failures remain failures)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Complete workspace tests (baseline failures remain failures)
        if: always() && !cancelled()
        run: |
          if [ "$RUNNER_OS" = 'Linux' ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --locked --workspace --no-fail-fast
          else
            cargo test --locked --workspace --no-fail-fast
          fi
