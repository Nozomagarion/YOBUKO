name: Multiplayer Internet session test

# A real Internet session between separate machines (the owner's own runners): a Linux host, then guests on
# Linux, macOS and Windows who join with the same short code, exactly as friends would.
# The host's code travels to the guests as a short-lived artifact of this run.
on:
  workflow_dispatch:
    inputs:
      guests:
        description: 'Guests joining with the same code (1 to 3)'
        default: '3'
  push:
    branches: ['claude/project-thread-*', 'release-check/*']
    paths:
      - 'crates/multiplayer/**'
      - '.github/workflows/multiplayer-internet-test.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: multiplayer-internet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 'false'
  GUESTS: ${{ inputs.guests || '3' }}

jobs:
  host:
    # The owner's Linux runner registers two instances (yobuko-linux-1 and -2), so the host and the
    # Linux guest below run side by side instead of waiting on each other.
    runs-on: yobuko-linux  # Ubuntu 22.04 in WSL on the owner's own PC (self-hosted runner): no GitHub minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux prerequisites
        # The owner's Linux runner has these installed by scripts/self-hosted/yobuko-linux-runner.sh,
        # so apt only runs (with sudo) when one is missing.
        run: |
          missing=$(for p in libasound2-dev pkg-config; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The Rekordbox USB export (rbxport's exportLibrary.db) builds SQLCipher with a vendored
      # OpenSSL, whose Configure needs a full Perl; Git Bash's own perl lacks modules it uses.
      - name: Windows Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Build the probe
        run: cargo build --locked --release -p suhina-multiplayer --example internet_session
      - name: Wait until every guest has built its probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 360); do
            ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[].name | select(startswith("guest-ready-"))] | length')
            echo "guests ready: $ready / $GUESTS"
            [ "$ready" -ge "$GUESTS" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Host over the Internet
        run: |
          mkdir -p code
          target/release/examples/internet_session host --guests "$GUESTS" --code-file code/code.txt \
            --timeout 1800 --linger 60 > host.log 2>&1 &
          echo $! > host.pid
          for _ in $(seq 120); do [ -s code/code.txt ] && break; sleep 1; done
          cat host.log
          test -s code/code.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internet-session-code
          path: code/code.txt
          retention-days: 1
      - name: Wait for the guests
        run: |
          pid=$(cat host.pid)
          while kill -0 "$pid" 2>/dev/null; do sleep 2; done
          cat host.log
          grep -q 'HOST OK' host.log

  guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: yobuko-linux  # Ubuntu 22.04 in WSL on the owner's own PC (self-hosted runner): no GitHub minutes
            index: 1
          - os: yobuko-mac  # the owner's own Mac (self-hosted runner): no GitHub macOS minutes
            index: 2
          - os: yobuko-windows  # the owner's own PC (self-hosted runner): no GitHub minutes
            index: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.index <= fromJSON(inputs.guests || '3')
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        # The Mac's own Python is used on the self-hosted runner: the downloaded
        # macOS build installs only into /Users/runner, which exists on GitHub's machines alone.
        if: runner.environment == 'github-hosted' && matrix.index <= fromJSON(inputs.guests || '3')
        with:
          python-version: '3.12'
      - name: Keep jobs apart from the owner's own files
        # The owner's Mac and PC hold real YOBUKO settings and plug-ins. Tests must not read or change
        # them, so later steps get an empty home; Rust stays where it is installed. The Mac also has
        # only python3 while the scripts call python.
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          rm -rf "$RUNNER_TEMP/home" && mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v python3)" "$RUNNER_TEMP/bin/python"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          # Ubuntu 22.04's python3 is 3.10; the scripts need 3.11 or later (tomllib), as on
          # GitHub's machines, so the Linux runner uses Ubuntu's python3.11 package.
          if [ "$RUNNER_OS" = Linux ] && ! python3 -c 'import tomllib' 2>/dev/null; then
            if ! command -v python3.11 >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y python3.11
            fi
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v python3.11)" "$RUNNER_TEMP/bin/python3"
            ln -sf "$(command -v python3.11)" "$RUNNER_TEMP/bin/python"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - if: runner.os == 'Linux' && matrix.index <= fromJSON(inputs.guests || '3')
        # The owner's Linux runner has these installed by scripts/self-hosted/yobuko-linux-runner.sh,
        # so apt only runs (with sudo) when one is missing.
        run: |
          missing=$(for p in libasound2-dev pkg-config; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.index <= fromJSON(inputs.guests || '3')
      # The Rekordbox USB export (rbxport's exportLibrary.db) builds SQLCipher with a vendored
      # OpenSSL, whose Configure needs a full Perl; Git Bash's own perl lacks modules it uses.
      - name: Windows Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - name: Build the probe
        if: matrix.index <= fromJSON(inputs.guests || '3')
        run: cargo build --locked --release -p suhina-multiplayer --example internet_session
      - name: Say this guest is ready
        if: matrix.index <= fromJSON(inputs.guests || '3')
        run: echo ready > ready.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.index <= fromJSON(inputs.guests || '3')
        with:
          name: guest-ready-${{ matrix.index }}
          path: ready.txt
          retention-days: 1
      - name: Wait for the host's code
        if: matrix.index <= fromJSON(inputs.guests || '3')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 240); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "internet-session-code") | .id][0] // empty')
            if [ -n "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > code.zip
              python -m zipfile -e code.zip code
              break
            fi
            sleep 5
          done
          test -s code/code.txt
      - name: Join with the code
        if: matrix.index <= fromJSON(inputs.guests || '3')
        run: |
          probe=target/release/examples/internet_session
          [ "$RUNNER_OS" = Windows ] && probe="$probe.exe"
          "$probe" join --code-file code/code.txt --index ${{ matrix.index }} --guests "$GUESTS" --timeout 900
